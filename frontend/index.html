<!-- 声明使用 HTML5 文档标准。 -->
<!doctype html>
<!-- 页面根元素，语言设置为简体中文。 -->
<html lang="zh-CN">
  <!-- 文档元数据区域。 -->
  <head>
    <!-- 指定 UTF-8 编码，保证中文正确显示。 -->
    <meta charset="UTF-8" />
    <!-- 让移动端按设备宽度布局。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 配置浏览器地址栏的主题色。 -->
    <meta name="theme-color" content="#0b1020" />
    <!-- 设置浏览器标签页标题。 -->
    <title>Campus Pass · 校园文化节</title>
  </head>
  <!-- 页面可见内容区域。 -->
  <body>
    <!-- React 将整个应用挂载到此节点。 -->
    <div id="root"></div>
    <!-- 以 ES 模块方式加载前端入口。 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
